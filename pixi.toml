[workspace]
authors = ["Benoit Dufumier <benoit.dufumier@cea.fr>", "Pauline Amrouche <pauline.amrouche.cea.fr"]
channels = ["conda-forge", "nvidia"]
name = "synthseg_env"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[system-requirements]
cuda = "10.1"

[dependencies]
python = "==3.10"
cudnn = "7.6.5.*"

[pypi-dependencies]
tensorflow = ">=2.10,<2.16"
torchio = "==1.0.2"

absl-py = ">=1.4,<3"
astunparse = ">=1.6.3,<2"
certifi = ">=2023,<2027"
charset-normalizer = ">=3,<4"
fonttools = ">=4.39,<5"
gast = ">=0.4,<0.6"
google-pasta = ">=0.2,<1"
grpcio = ">=1.51,<2"
h5py = ">=3.8,<4"
idna = ">=3,<4"
kiwisolver = ">=1.4,<2"
markdown = ">=3.4,<4"
markupsafe = ">=2.1,<3"
matplotlib = ">=3.7,<4"
nibabel = ">=5,<6"
numpy = ">=1.23.5,<2"
opt-einsum = ">=3.3,<4"
packaging = ">=23,<26"
pillow = ">=9.4,<11"
protobuf = ">=3.20.3,<5"
pyparsing = ">=3,<4"
python-dateutil = ">=2.8.2,<3"
pyyaml = ">=6,<7"
requests = ">=2.31,<3"
scipy = ">=1.10,<2"
six = ">=1.16,<2"
tensorboard = ">=2.10,<2.16"
termcolor = ">=2.2,<4"
urllib3 = ">=1.26,<3"
werkzeug = ">=2.2,<4"
wrapt = ">=1.14,<2"
